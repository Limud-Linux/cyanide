<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root can own the service -->
  <policy user="root">
    <allow own="org.archinstaller"/>
    <allow send_destination="org.archinstaller"/>
  </policy>

  <!-- Allow any user on the system bus to communicate with the service.
       This enables the Vala GUI running as the live unprivileged user to call StartInstall. -->
  <policy context="default">
    <allow send_destination="org.archinstaller"/>
    <allow receive_sender="org.archinstaller"/>
  </policy>
</busconfig>
